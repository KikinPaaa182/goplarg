apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goplarg
spec:
  ingressClassName: traefik
  rules:
    - host: goplarg.com.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mi-web-service
                port:
                  number: 80
