apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goplarg
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - goplarg.com.ar
      secretName: goplarg-tls
  rules:
    - host: goplarg.com.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goplarg
                port:
                  number: 80
