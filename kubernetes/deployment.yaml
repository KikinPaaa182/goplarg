apiVersion: apps/v1
kind: Deployment
metadata:
  name: goplarg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goplarg
  template:
    metadata:
      labels:
        app: goplarg
    spec:
      containers:
        - name: goplarg
          image: goplarg:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
